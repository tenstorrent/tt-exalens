name: "Community Issue / PR Labeling Workflow"

on:
  issues:
    types: [opened]
  pull_request:
    types: [opened]

permissions:
  issues: write
  pull-requests: write

jobs:
  call-central-workflow:
    if: ${{ !endsWith(github.actor, '[bot]') }}
    uses: tenstorrent/tt-github-actions/.github/workflows/on-community-issue.yml@5f18fe6f86d825c87924d5559ac442ac7eca534f # main, 2026-11-06
